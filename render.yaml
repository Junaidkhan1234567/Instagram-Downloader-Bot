services:
  # Telegram Bot (Worker)
  - type: worker
    name: instagram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        fromEnv: BOT_TOKEN
      - key: ADMIN_IDS
        fromEnv: ADMIN_IDS
      - key: WEB_URL
        fromEnv: WEB_URL
      - key: API_URL
        fromEnv: API_URL
      - key: API_KEY
        fromEnv: API_KEY

  # Web Server (Web)
  - type: web
    name: instagram-downloader-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 1000
