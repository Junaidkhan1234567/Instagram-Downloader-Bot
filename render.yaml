services:
  - type: worker
    name: instagram-bot
    runtime: image
    buildCommand: docker build -t instagram-bot .
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: API_URL
        value: https://vkrdownloader.xyz/server/
      - key: API_KEY
        value: vkrdownloader
