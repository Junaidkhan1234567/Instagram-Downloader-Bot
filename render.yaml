services:
  - type: worker
    name: instagram-bot
    runtime: docker
    repo: https://github.com/Junaidkhan1234567/Instagram-Downloader-Bot
    branch: 3rd-party
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: API_URL
        value: https://vkrdownloader.xyz/server/
      - key: API_KEY
        value: vkrdownloader
